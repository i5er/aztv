name: Look up clubs by name

# TheSportsDB is unreachable from the dev container; CI looks clubs up by name
# and pushes them to the data-teams branch for review.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/tools/find_teams.py']

permissions:
  contents: write

jobs:
  teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/find_teams.py
      - name: Push to data-teams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-teams
          git rm -rfq --cached .
          git add teams
          git commit -qm "Clubs found on TheSportsDB"
          git push -f origin data-teams
