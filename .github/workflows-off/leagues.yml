name: Look up league ids

# TheSportsDB is unreachable from the dev container; CI looks up the real ids
# and pushes them to the data-leagues branch for review.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/tools/fetch_leagues.py']

permissions:
  contents: write

jobs:
  leagues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/fetch_leagues.py
      - name: Push to data-leagues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-leagues
          git rm -rfq --cached .
          git add leagues
          git commit -qm "League ids from TheSportsDB"
          git push -f origin data-leagues
