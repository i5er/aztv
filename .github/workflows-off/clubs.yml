name: Resolve club names

# Wikidata is unreachable from the dev container; CI maps the Arabic Wikipedia club
# list to English names and pushes the result to the data-clubs branch for review.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/tools/resolve_clubs.py', '.github/tools/saudi-clubs-ar.json']

permissions:
  contents: write

jobs:
  clubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/resolve_clubs.py
      - name: Push to data-clubs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-clubs
          git rm -rfq --cached .
          git add clubs
          git commit -qm "Saudi club names: English -> Arabic"
          git push -f origin data-clubs
