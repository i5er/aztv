<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<title>صور AZ TV</title>
<style>
@font-face { font-family: T; src: url(/fonts/Thmanyah-Regular.otf); font-weight: 400; }
@font-face { font-family: T; src: url(/fonts/Thmanyah-Medium.otf); font-weight: 600; }
@font-face { font-family: TD; src: url(/fonts/ThmanyahDisplay-Bold.otf); font-weight: 700; }
:root {
  --bg: #0d0b09; --card: #1a1714; --line: rgba(255,255,255,.08); --text: #fffdf6; --dim: rgba(255,253,246,.62);
  --gold: #d6af6b; --gold2: #f1cc86; --red: #e5484d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: T, system-ui, sans-serif; }
body {
  min-height: 100vh; padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(214,175,107,.22), transparent 60%),
    var(--bg);
}
.wrap { max-width: 560px; margin: 0 auto; }
.brand { text-align: center; color: var(--gold); letter-spacing: .08em; font-weight: 600; font-size: 14px; padding-top: 28px; }
h1 { font-family: TD, T, sans-serif; font-weight: 700; text-align: center; font-size: 30px; margin: 6px 0 4px; }
.sub { text-align: center; color: var(--dim); font-size: 15px; margin: 0 0 24px; }

/* the code screen */
.gate { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 20px; text-align: center; }
.gate p { color: var(--dim); margin: 0 0 18px; }
.pin { display: flex; gap: 12px; justify-content: center; direction: ltr; }
.pin input {
  width: 58px; height: 68px; border-radius: 16px; border: 2px solid var(--line); background: rgba(255,255,255,.05);
  color: var(--text); font: 700 30px TD, T, sans-serif; text-align: center; outline: none;
}
.pin input:focus { border-color: var(--gold); }
.err { color: #ff8a8a; min-height: 24px; margin-top: 14px; }

/* the account */
.me { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; }
.av { width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 36px; background-size: cover; background-position: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.me .n { font-family: TD, T, sans-serif; font-size: 24px; }
.me .c { color: var(--dim); font-size: 14px; }
.me .links { margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.link { color: var(--gold); background: none; border: 0; padding: 0; font: 600 14px T, sans-serif; cursor: pointer; }

.add {
  margin: 18px 0 8px; width: 100%; height: 64px; border: 0; border-radius: 20px; cursor: pointer;
  background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #1a1206; font: 700 19px TD, T, sans-serif;
  box-shadow: 0 10px 30px rgba(214,175,107,.25); display: flex; align-items: center; justify-content: center; gap: 10px;
}
.add:active { transform: scale(.98); }
.hint { text-align: center; color: var(--dim); font-size: 13px; margin: 0 0 22px; }

.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0 18px; display: none; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
.status { text-align: center; color: var(--gold); min-height: 22px; font-size: 14px; }

.head { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 2px 12px; }
.head b { font-family: TD, T, sans-serif; font-size: 18px; font-weight: 700; }
.head span { color: var(--dim); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ph { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #222; animation: pop .35s ease-out; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button {
  position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(0,0,0,.6); color: #fff; font-size: 18px; backdrop-filter: blur(6px);
}
.empty { grid-column: 1/-1; text-align: center; color: var(--dim); padding: 36px 12px; border: 1.5px dashed var(--line); border-radius: 18px; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
.hide { display: none !important; }
.foot { text-align: center; color: rgba(255,255,255,.35); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">AZ TV</div>

  <section id="gate">
    <h1>أرسل صورك للتلفزيون</h1>
    <p class="sub">بتظهر في الشاشة الرئيسية وشاشة التوقف</p>
    <div class="gate">
      <p>اكتب الرمز الظاهر على التلفزيون</p>
      <div class="pin" id="pin">
        <input inputmode="numeric" maxlength="1" autocomplete="one-time-code">
        <input inputmode="numeric" maxlength="1">
        <input inputmode="numeric" maxlength="1">
        <input inputmode="numeric" maxlength="1">
      </div>
      <div class="err" id="gerr"></div>
    </div>
  </section>

  <section id="app" class="hide">
    <h1 id="hello">أهلاً</h1>
    <p class="sub">الصور تروح لحسابك بس، وما يشوفها غيرك لما يكون حسابك هو اللي يشاهد</p>

    <div class="me">
      <div class="av" id="av"></div>
      <div>
        <div class="n" id="name"></div>
        <div class="c" id="count"></div>
        <div class="links">
          <button class="link" id="avBtn">تغيير الصورة الرمزية</button>
          <button class="link hide" id="avReset">الرجوع للرمز</button>
        </div>
      </div>
    </div>

    <button class="add" id="addBtn"><span style="font-size:24px">＋</span> أضف صور</button>
    <p class="hint">تقدر تختار أكثر من صورة مرة وحدة</p>
    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status"></div>

    <div class="head"><b>صورك على التلفزيون</b><span id="cap"></span></div>
    <div class="grid" id="grid"></div>
    <div class="foot">هذه الصفحة تعمل فقط وشاشة «صور الحساب» مفتوحة على التلفزيون</div>
  </section>

  <input type="file" id="files" accept="image/*" multiple class="hide">
  <input type="file" id="avFile" accept="image/*" class="hide">
</div>
<script>
const $ = s => document.querySelector(s);
let K = (location.hash.match(/k=(\d{4})/) || [])[1] || sessionStorage.getItem('k') || '';
let state = null;

const api = (path, opt = {}) => fetch(path + (path.includes('?') ? '&' : '?') + 'k=' + K, opt);

async function load() {
  const r = await api('/api/state');
  if (r.status === 403) throw new Error('code');
  if (!r.ok) throw new Error('net');
  state = await r.json();
  render();
}

function render() {
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#hello').textContent = 'أهلاً ' + state.name;
  $('#name').textContent = state.name;
  const n = state.photos.length;
  $('#count').textContent = n ? n + ' صورة على التلفزيون' : 'ما فيه صور بعد';
  $('#cap').textContent = n + ' من ' + state.max;
  const av = $('#av');
  if (state.avatar) { av.textContent = ''; av.style.backgroundImage = `url(/api/avatar?k=${K}&t=${Date.now()})`; }
  else { av.style.backgroundImage = `linear-gradient(135deg, ${state.color}, #1a1206)`; av.textContent = state.emoji; }
  $('#avReset').classList.toggle('hide', !state.avatar);
  const g = $('#grid');
  g.innerHTML = '';
  if (!n) g.innerHTML = '<div class="empty">اضغط «أضف صور» واختر من الألبوم</div>';
  for (const name of state.photos) {
    const d = document.createElement('div');
    d.className = 'ph';
    d.innerHTML = `<img loading="lazy" src="/api/photo?n=${name}&k=${K}" alt=""><button aria-label="حذف">✕</button>`;
    d.querySelector('button').onclick = async () => {
      if (!confirm('تحذف الصورة من التلفزيون؟')) return;
      d.style.opacity = .4;
      await api('/api/delete?n=' + encodeURIComponent(name), { method: 'POST' });
      load();
    };
    g.appendChild(d);
  }
}

// the code boxes
const boxes = [...document.querySelectorAll('#pin input')];
boxes.forEach((b, i) => {
  b.addEventListener('input', () => {
    b.value = b.value.replace(/\D/g, '').slice(-1);
    if (b.value && i < 3) boxes[i + 1].focus();
    const v = boxes.map(x => x.value).join('');
    if (v.length === 4) tryCode(v);
  });
  b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && i) boxes[i - 1].focus(); });
  b.addEventListener('paste', e => {
    const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
    if (t.length === 4) { e.preventDefault(); t.split('').forEach((c, j) => boxes[j].value = c); tryCode(t); }
  });
});

async function tryCode(v) {
  K = v;
  try {
    await load();
    sessionStorage.setItem('k', K);
  } catch (e) {
    $('#gerr').textContent = e.message === 'code' ? 'الرمز غير صحيح، شيّك على التلفزيون' : 'ما قدرت أوصل للتلفزيون، تأكد إن شاشة «صور الحساب» مفتوحة';
    boxes.forEach(b => b.value = '');
    boxes[0].focus();
  }
}

// shrink on the phone first: faster over Wi-Fi; HEIC the browser can't draw goes as it is
async function shrink(file, max, square) {
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
    if (square) { const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; w = h = Math.min(s, max); }
    else { const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); }
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
    return blob || file;
  } catch (e) { return file; }
}

function setBar(p) {
  $('#bar').style.display = p == null ? 'none' : 'block';
  $('#bar i').style.width = ((p || 0) * 100) + '%';
}

$('#addBtn').onclick = () => $('#files').click();
$('#avBtn').onclick = () => $('#avFile').click();
$('#avReset').onclick = async () => { await api('/api/avatar-reset', { method: 'POST' }); load(); };

$('#files').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  let ok = 0, bad = 0;
  for (let i = 0; i < files.length; i++) {
    $('#status').textContent = `أرسل ${i + 1} من ${files.length}…`;
    setBar(i / files.length);
    try {
      const body = await shrink(files[i], 1920, false);
      const r = await api('/api/upload', { method: 'POST', body });
      if (r.status === 409) { $('#status').textContent = 'وصلت الحد الأعلى للصور، احذف بعضها أول'; bad += files.length - i; break; }
      r.ok ? ok++ : bad++;
    } catch (err) { bad++; }
  }
  setBar(null);
  $('#status').textContent = ok ? `تم إرسال ${ok} ${ok === 1 ? 'صورة' : 'صور'} ✓` + (bad ? ` · ${bad} ما وصلت` : '') : 'ما وصلت الصور، جرّب مرة ثانية';
  load();
};

$('#avFile').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  $('#status').textContent = 'أرسل صورتك…';
  const r = await api('/api/avatar', { method: 'POST', body: await shrink(f, 600, true) });
  $('#status').textContent = r.ok ? 'تم تغيير صورتك ✓' : 'ما قدرت أقرأ الصورة';
  load();
};

if (K.length === 4) tryCode(K); else boxes[0].focus();
</script>
</body>
</html>
